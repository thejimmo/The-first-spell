<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="62%" r="75%">
      <stop offset="0%" stop-color="#13322c"/>
      <stop offset="45%" stop-color="#0c1f1b"/>
      <stop offset="100%" stop-color="#060e0d"/>
    </radialGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c97a" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#caa257" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#caa257" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameOuter" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="55%" stop-color="#f3b24a"/>
      <stop offset="100%" stop-color="#c46a1e" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="flameInner" cx="50%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="candleBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#caa770"/>
      <stop offset="45%" stop-color="#f0ddb2"/>
      <stop offset="100%" stop-color="#9c7c4e"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd9a4"/>
      <stop offset="100%" stop-color="#c8a45e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bgGlow)"/>

  <!-- title -->
  <g fill="url(#goldText)" text-anchor="middle" font-weight="500">
    <text x="300" y="150" font-size="92" letter-spacing="20">THE</text>
    <text x="300" y="250" font-size="92" letter-spacing="14">FIRST</text>
    <text x="300" y="350" font-size="92" letter-spacing="12">SPELL</text>
  </g>
  <g fill="#d8bd85" text-anchor="middle" font-size="21" letter-spacing="6" font-family="Georgia, serif">
    <text x="300" y="408">A PRACTICAL MAGIC SYSTEM</text>
    <text x="300" y="438">FOR THE MODERN WORLD</text>
  </g>

  <!-- sigil circle -->
  <g fill="none" stroke="#caa86b" stroke-opacity="0.28">
    <circle cx="300" cy="600" r="118" stroke-width="1.5"/>
    <circle cx="300" cy="600" r="104" stroke-width="0.8"/>
    <polygon points="300,488 397,544 397,656 300,712 203,656 203,544" stroke-width="1"/>
    <polygon points="300,712 397,656 397,544 300,488 203,544 203,656" stroke-width="0.6" transform="rotate(30 300 600)"/>
  </g>

  <!-- candle glow -->
  <circle cx="300" cy="600" r="190" fill="url(#candleGlow)"/>

  <!-- flame -->
  <path d="M300 508 C318 545 326 565 326 585 C326 608 314 622 300 622 C286 622 274 608 274 585 C274 565 282 545 300 508 Z" fill="url(#flameOuter)"/>
  <path d="M300 545 C309 565 313 578 313 590 C313 605 307 613 300 613 C293 613 287 605 287 590 C287 578 291 565 300 545 Z" fill="url(#flameInner)"/>

  <!-- wick -->
  <rect x="298" y="616" width="4" height="14" rx="2" fill="#3a2a18"/>

  <!-- candle body -->
  <rect x="262" y="628" width="76" height="150" rx="6" fill="url(#candleBody)"/>
  <ellipse cx="300" cy="630" rx="38" ry="9" fill="#f4e4bb"/>

  <!-- bottom subtitle -->
  <g fill="#d8bd85" text-anchor="middle" font-size="24" letter-spacing="7" font-family="Georgia, serif">
    <text x="300" y="826">A PRACTICAL MAGIC SYSTEM</text>
    <text x="300" y="862">FOR THE MODERN WORLD</text>
  </g>
</svg>
